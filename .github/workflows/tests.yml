name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only)
        run: python -m unittest discover -s tests -t . -v
      - name: Wheel builds and runs
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist .
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          RIVER_DB=/tmp/q.db /tmp/v/bin/river guide | head -1
          RIVER_DB=/tmp/q.db /tmp/v/bin/river project add demo
