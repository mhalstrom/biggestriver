name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only)
        run: python -m unittest discover -s tests -t . -v
      - name: Wheel builds and runs
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist .
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          RIVER_DB=/tmp/q.db /tmp/v/bin/river guide | head -1
          RIVER_DB=/tmp/q.db /tmp/v/bin/river project add demo
      - uses: actions/setup-node@v5
        if: runner.os == 'macOS'
        with:
          node-version: "22"
      - name: Desktop smoke test (river serve starts and stops)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm test
  # Windows: river and the desktop app starter work there too (#273, #274).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: "Tests (standard library, plus tzdata: Windows has no time zone database)"
        run: |
          python -m pip install --quiet tzdata
          python -m unittest discover -s tests -t . -v
      - name: Desktop smoke test (river serve starts and stops)
        if: always()
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm test
